<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#19888d" />
    <meta name="description" content="연차, 주말, 공휴일까지 똑똑하게 계산해 최적의 휴가 조합을 찾아주는 나만의 휴가 플래너" />
    <title>휴가요정</title>

    <!--
      공유 미리보기(Open Graph).
      카카오톡·페이스북·슬랙 등에 링크를 붙여넣으면 이 이미지와 문구로 카드가 만들어지고,
      카드를 누르면 og:url 로 이동한다. 이미지 주소는 전체 URL 이어야 해서
      빌드 시 .env 의 VITE_SITE_URL 로 채운다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="휴가요정" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:title" content="휴가요정 - 최적의 휴가 조합을 찾아줄게!" />
    <meta property="og:description" content="연차, 주말, 공휴일까지 똑똑하게 계산해주는 나만의 휴가 플래너" />
    <meta property="og:image" content="%VITE_SITE_URL%og-image.jpg" />
    <meta property="og:image:secure_url" content="%VITE_SITE_URL%og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="밀짚모자를 쓴 나무늘보가 해변 의자에서 쉬고 있는 휴가요정 대표 이미지" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="휴가요정 - 최적의 휴가 조합을 찾아줄게!" />
    <meta name="twitter:description" content="연차, 주말, 공휴일까지 똑똑하게 계산해주는 나만의 휴가 플래너" />
    <meta name="twitter:image" content="%VITE_SITE_URL%og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      file:// 로 열면 브라우저가 외부 스크립트·스타일을 CORS로 차단해 앱이 뜨지 않는다.
      그 경우 흰 화면 대신 원인과 해결 방법을 보여준다.
      (이 스크립트는 인라인이라 file:// 에서도 항상 실행된다.)
    -->
    <script>
      (function () {
        if (location.protocol !== "file:") return;
        window.addEventListener("load", function () {
          setTimeout(function () {
            var root = document.getElementById("root");
            if (!root || root.childElementCount > 0) return;
            document.body.style.cssText =
              "margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;" +
              "background:#fdfbf5;font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;padding:24px";
            root.innerHTML =
              '<div style="max-width:520px;background:#fff;border:1px solid #ece7db;border-radius:22px;' +
              'padding:32px;box-shadow:0 2px 10px rgba(43,43,40,.06);line-height:1.65;color:#2b2b28">' +
              '<div style="font-size:40px;text-align:center">🦥</div>' +
              '<h1 style="margin:12px 0 8px;font-size:20px;text-align:center;color:#0f6a6e">이 파일로는 열 수 없어요</h1>' +
              '<p style="margin:0 0 20px;font-size:14px;color:#55534c;text-align:center">' +
              '브라우저가 보안 정책(CORS)으로 외부 스크립트를 차단해서 화면이 비어 있어요.</p>' +
              '<div style="background:#eff8fa;border:1px solid #dceee9;border-radius:14px;padding:16px;font-size:14px">' +
              '<p style="margin:0 0 8px;font-weight:800;color:#0f6a6e">✅ 이 파일을 여세요</p>' +
              '<code style="display:block;background:#fff;border:1px solid #ece7db;border-radius:8px;' +
              'padding:10px;font-size:13px;word-break:break-all">dist-standalone/index.html</code>' +
              '<p style="margin:12px 0 6px;font-size:13px;color:#55534c">아직 없다면 터미널에서:</p>' +
              '<code style="display:block;background:#fff;border:1px solid #ece7db;border-radius:8px;' +
              'padding:10px;font-size:13px">npm run build:standalone</code></div>' +
              '<p style="margin:18px 0 0;font-size:13px;color:#8b8a82;text-align:center">' +
              '개발 중이라면 <b>npm run dev</b> 후 <b>http://localhost:5173</b> 으로 접속하세요.</p>' +
              "</div>";
          }, 700);
        });
      })();
    </script>
  </body>
</html>
